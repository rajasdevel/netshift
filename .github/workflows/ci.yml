name: Check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new Go releases and standard-library vulnerabilities surface
    # between commits.
    - cron: '23 5 * * 1'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Supersede only pull request runs; main, scheduled, and release runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows is verified only here: the maintainers have no Windows machine.
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # fish and zsh for the completion tests; dbus-user-session for the
      # user manager that make smoke needs.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dbus-user-session fish zsh
      - run: make check
        if: runner.os != 'Windows'
      # Each generated script must parse in its own shell and complete a
      # command name; the Go tests that run each shell must not skip.
      - name: Completion scripts in bash, zsh, and fish
        if: runner.os == 'Linux'
        run: |
          set -eu
          dir=$(mktemp -d)
          go build -o "$dir/netshift" .
          "$dir/netshift" completion bash > "$dir/netshift.bash"
          "$dir/netshift" completion zsh > "$dir/_netshift"
          "$dir/netshift" completion fish > "$dir/netshift.fish"
          bash -n "$dir/netshift.bash"
          zsh -n "$dir/_netshift"
          fish --no-config --no-execute "$dir/netshift.fish"
          test "$(bash --norc --noprofile -c '. "$1"; COMP_WORDS=(netshift ser); COMP_CWORD=1; _netshift; echo "${COMPREPLY[*]}"' bash "$dir/netshift.bash")" = service
          test "$(zsh -f -c 'autoload -Uz compinit && compinit -u -D && . "$1" && print -r -- $_comps[netshift]' zsh "$dir/_netshift")" = _netshift
          test "$(fish --no-config -c "source '$dir/netshift.fish'; complete -C 'netshift ser'" | cut -f1)" = service
          passed=$(go test -count=1 -v -run '^Test(Bash|Zsh|Fish)Completion$' ./internal/cli | grep -c -- '^--- PASS: Test')
          test "$passed" = 3
      - name: Static analysis
        if: runner.os != 'Windows'
        run: make lint
      # make check's gofmt, release-script, and recipe checks are
      # platform-independent and run on macOS and Linux; make lint there also
      # analyzes the Windows build. This runs what only Windows can.
      - name: Windows tests
        if: runner.os == 'Windows'
        run: |
          go vet ./...
          go test ./...
          go test -race ./...
          go run . --config config/windows.example.json validate
          go run . --config config/azure.example.json validate
      - name: Known vulnerabilities in the standard library
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Every target is cross-compiled, so one runner measures them all.
      - name: Release binary size budget
        if: runner.os == 'Linux'
        run: make size-check
      - name: Prepare Linux user manager
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Native service and command hook
        if: runner.os != 'Windows'
        run: make smoke
      - name: Native service and command hook (Task Scheduler)
        if: runner.os == 'Windows'
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w' -o bin/netshift.exe .
          python scripts/native-smoke.py --binary bin/netshift.exe
