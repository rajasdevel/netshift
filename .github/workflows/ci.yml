name: Check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new Go releases and standard-library vulnerabilities surface
    # between commits.
    - cron: '23 5 * * 1'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Supersede only pull request runs; main, scheduled, and release runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: make check
      - name: Static analysis
        run: make lint
      - name: Known vulnerabilities in the standard library
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Prepare Linux user manager
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dbus-user-session
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Native service and command hook
        run: make smoke
