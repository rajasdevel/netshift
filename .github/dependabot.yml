version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a new action release age before proposing it.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
  # The module has no dependencies today; this covers any added later.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
