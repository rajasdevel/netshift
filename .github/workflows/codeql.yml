name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new CodeQL queries run between commits.
    - cron: '41 4 * * 3'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  # Supersede only pull request runs; main and scheduled runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the source
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Go module and its tests use only the standard library.
          - language: go
            build-mode: manual
          # The workflows themselves, for injection and permission issues.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build
        if: matrix.build-mode == 'manual'
        run: go build ./...
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
